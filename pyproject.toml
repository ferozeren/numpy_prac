[project]
name = "numpy-prac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ferozeren", email = "ferozeren@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
]

[project.scripts]
numpy-prac = "numpy_prac:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
